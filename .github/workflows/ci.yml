name: "Continuous Integration"

run-name: "Continuous Integration • ${{ github.ref_name }} @${{ github.actor }}"

concurrency:
    group: "ci-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

on:
    push:
        branches:
            - "source"
    pull_request:
        branches:
            - "source"
    merge_group:
        branches:
            - "source"
        types:
            - "checks_requested"

permissions:
    contents: "read"

jobs:
    test:
        name: "Test (${{ matrix.label }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 60
        permissions:
            contents: "read"
            id-token: "write"
        strategy:
            fail-fast: true
            matrix:
                include:
                    - label: "linux / Node 22.22"
                      os: "ubuntu-latest"
                      node_version: "22.22.3"
                      codecov_flag: "os-linux"
                    - label: "linux / Node 24.19"
                      os: "ubuntu-latest"
                      node_version: "24.19.0"
                      codecov_flag: "node-24-linux"
                    - label: "linux / Node 26.7"
                      os: "ubuntu-latest"
                      node_version: "26.7.0"
                      codecov_flag: "node-26-linux"
                    - label: "windows / Node 24.19"
                      os: "windows-latest"
                      node_version: "24.19.0"
                      codecov_flag: "os-windows"
                    - label: "macos / Node 24.19"
                      os: "macos-latest"
                      node_version: "24.19.0"
                      codecov_flag: "os-macos"
        defaults:
            run:
                shell: "bash"

        steps:
            - name: "Harden the runner (Audit all outbound calls)"
              if: "${{ matrix.os == 'ubuntu-latest' }}"
              uses: "step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c" # v2.21.0
              with:
                  egress-policy: "audit"

            - name: "Checkout repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Setup Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version: "${{ matrix.node_version }}"
                  package-manager-cache: false

            - name: "Use the pinned npm version"
              run: "npm install --global npm@12.0.2 --ignore-scripts"

            - name: "Install dependencies"
              run: "npm ci --ignore-scripts"

            - name: "Build package"
              run: "npm run build"

            - name: "Typecheck"
              run: "npm run typecheck"

            - name: "Lint"
              run: "npm run lint"

            - name: "Run tests with coverage and JUnit report"
              run: "npm run test:ci"
              env:
                  CI: "true"

            - name: "Verify coverage artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('coverage/lcov.info').is_file(), 'coverage/lcov.info was not generated'"

            - name: "Verify JUnit artifact"
              run: >-
                  python -c "from pathlib import Path; assert Path('test-report.junit.xml').is_file(), 'test-report.junit.xml was not generated'"

            - name: "Upload test results to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "test-report.junit.xml"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-junit-${{ matrix.codecov_flag }}"
                  report_type: "test_results"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  use_oidc: true
                  slug: "${{ github.repository }}"
                  files: "./coverage/lcov.info"
                  flags: "${{ matrix.codecov_flag }}"
                  name: "vitest-unit-coverage-${{ matrix.codecov_flag }}"
                  report_type: "coverage"
                  fail_ci_if_error: true
                  disable_search: true
                  verbose: true
